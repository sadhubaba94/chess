<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Kingside: play chess against the computer or a friend, right in your browser." />
    <meta name="theme-color" content="#1f2a24" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kingside</title>
    <script>
      // Apply the saved colour theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('kingside:v1:settings') || '{}');
          var dark = s.theme === 'dark' || (s.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Kingside needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
